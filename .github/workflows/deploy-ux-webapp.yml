name: Deploy UX web app to GitHub Pages

# Sitio retirado a solicitud de Eric Toledano el 10 de octubre de 2026.
# Este workflow publica una página en blanco en lugar del web app. Para
# restaurar la publicación, revertir el commit que introdujo este cambio.

on:
  push:
    branches: [main, claude/serene-cray-06lv41]
    paths:
      - ".github/workflows/deploy-ux-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio vacío
        run: |
          mkdir -p sitio-vacio
          printf '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title></title></head><body></body></html>' > sitio-vacio/index.html
          cp sitio-vacio/index.html sitio-vacio/404.html

      - name: Upload empty site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio-vacio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
