name: Deploy UX web app to GitHub Pages

on:
  push:
    branches: [main, claude/serene-cray-06lv41]
    # La rama de trabajo no se agrega aquí: el entorno «github-pages» rechaza el
    # despliegue desde ramas no autorizadas y el trabajo falla antes de su primer
    # paso. Para publicar desde una rama hay que autorizarla en Settings →
    # Environments → github-pages → deployment branches, y agregarla a esta lista.
    paths:
      - "resultados/ux-v1/webapp/**"
      - ".github/workflows/deploy-ux-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: resultados/ux-v1/webapp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
