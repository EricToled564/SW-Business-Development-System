<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Masa magra perdida con y sin entrenamiento de fuerza" font-family="Helvetica, Arial, sans-serif" font-size="12"><text x="0" y="32" fill="#1d232a" font-weight="700">Tirzepatida sola</text><rect x="0" y="40" width="354.9" height="30" fill="#9aa3ad"/><text x="362.9" y="60" fill="#1d232a" font-weight="700">−4.67 kg de masa magra</text><text x="0" y="102" fill="#1d232a" font-weight="700">Tirzepatida + fuerza 3 veces por semana</text><rect x="0" y="110" width="271.3" height="30" fill="#d71920"/><text x="279.3" y="130" fill="#1d232a" font-weight="700">−3.57 kg de masa magra</text><text x="0" y="182" fill="#5f6b76">Pérdida de peso igual en ambos grupos: −22.61 kg y −22.28 kg (P = 0.694).</text><text x="0" y="200" fill="#5f6b76">Diferencia de masa magra: 1.09 kg a favor del grupo con fuerza (P &lt; 0.001).</text></svg>