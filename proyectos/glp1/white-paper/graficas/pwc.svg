<svg viewBox="0 0 640 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cambio en gasto en ejercicio de usuarios de GLP-1" font-family="Helvetica, Arial, sans-serif" font-size="12"><text x="0.0" y="14.0" font-size="12" fill="#1d232a" font-weight="700" text-anchor="start">Usuarios de GLP-1 que cambiaron su gasto en ejercicio (PwC Reino Unido, más de 2,300 usuarios)</text><rect x="0" y="26" width="432" height="30" fill="#2f7d57"/><text x="8.0" y="46.0" font-size="12" fill="#fff" font-weight="700" text-anchor="start">27% gasta más</text><rect x="436" y="26" width="80" height="30" fill="#d71920"/><text x="442.0" y="46.0" font-size="11" fill="#fff" font-weight="700" text-anchor="start">5% menos</text><text x="0.0" y="80.0" font-size="11" fill="#1d232a" font-weight="700" text-anchor="start">De quienes gastan más:</text><text x="0.0" y="96.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="start">41% se inscribió a un gimnasio o a clases  ·  20% se cambió a un club más premium  ·  16% contrató entrenador</text></svg>