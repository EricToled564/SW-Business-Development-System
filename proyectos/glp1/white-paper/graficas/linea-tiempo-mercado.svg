<svg viewBox="0 0 640 95" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Línea de tiempo del mercado de GLP-1 en México" font-family="Helvetica, Arial, sans-serif" font-size="12"><line x1="40" y1="40" x2="600" y2="40" stroke="#9aa3ad" stroke-width="3"/><circle cx="80" cy="40" r="9" fill="#5b0a0d"/><text x="80.0" y="20.0" font-size="12" fill="#5b0a0d" font-weight="700" text-anchor="middle">nov. 2024</text><text x="80.0" y="68.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">Tirzepatida aprobada en</text><text x="80.0" y="83.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">México (diabetes)</text><circle cx="240" cy="40" r="9" fill="#5b0a0d"/><text x="240.0" y="20.0" font-size="12" fill="#5b0a0d" font-weight="700" text-anchor="middle">2026</text><text x="240.0" y="68.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">3.8% de los hogares con</text><text x="240.0" y="83.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">al menos un usuario</text><circle cx="400" cy="40" r="9" fill="#d71920"/><text x="400.0" y="20.0" font-size="12" fill="#d71920" font-weight="700" text-anchor="middle">11 nov. 2026</text><text x="400.0" y="68.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">Wegovy en pastilla</text><text x="400.0" y="83.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">a la venta</text><circle cx="560" cy="40" r="9" fill="#d71920"/><text x="560.0" y="20.0" font-size="12" fill="#d71920" font-weight="700" text-anchor="middle">2029</text><text x="560.0" y="68.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">Posible llegada de</text><text x="560.0" y="83.0" font-size="11" fill="#1d232a" font-weight="400" text-anchor="middle">semaglutida genérica</text></svg>