<svg viewBox="0 0 640 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Masa magra perdida con y sin entrenamiento de fuerza" font-family="Helvetica, Arial, sans-serif" font-size="12"><text x="0.0" y="18.0" font-size="12" fill="#1d232a" font-weight="700" text-anchor="start">Tirzepatida sola</text><rect x="0" y="26" width="354.9" height="28" fill="#9aa3ad"/><text x="362.9" y="45.0" font-size="12" fill="#1d232a" font-weight="700" text-anchor="start">−4.67 kg de masa magra</text><text x="0.0" y="80.0" font-size="12" fill="#1d232a" font-weight="700" text-anchor="start">Tirzepatida + fuerza 3 veces por semana</text><rect x="0" y="88" width="271.3" height="28" fill="#d71920"/><text x="279.3" y="107.0" font-size="12" fill="#1d232a" font-weight="700" text-anchor="start">−3.57 kg de masa magra</text><text x="0.0" y="160.0" font-size="11" fill="#5f6b76" font-weight="400" text-anchor="start">Pérdida de peso igual en ambos grupos: −22.61 y −22.28 kg. Con fuerza, 23% menos masa magra perdida.</text></svg>