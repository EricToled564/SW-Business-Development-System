<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documento no disponible · Sports World</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#eff0ee;--surface:#fff;--ink:#12171a;--soft:#3f484f;--line:#cfd4d3;--a:#14456b;--a-bg:#dbe7f1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:660px;margin:0 auto;padding:clamp(40px,10vw,110px) 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:30px 32px}
  h1{font-family:"Spectral",Georgia,serif;font-size:23px;font-weight:600;margin:0 0 12px;line-height:1.25}
  p{margin:0 0 12px;color:var(--soft)}
  a.btn{display:inline-block;margin-top:8px;text-decoration:none;font-weight:600;font-size:14px;
    color:var(--a);background:var(--a-bg);border:1px solid var(--a);border-radius:4px;padding:9px 16px}
  a.btn:hover{background:var(--a);color:#fff}
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>Este documento no forma parte del depósito</h1>
    <p>La sección del Proceso Comercial se compone del manual y de los procedimientos por canal. Si llegaste
      aquí desde una liga guardada o desde una versión anterior de la página, el contenido que buscas está en
      el manual.</p>
    <a class="btn" href="../#mpc-01">Ir al Manual del Proceso Comercial</a>
  </div></div>
</body>
</html>
